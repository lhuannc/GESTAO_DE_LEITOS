version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestao-leitos-app
    ports:
      - "3000:80"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - gestao-leitos-network

  # Serviço opcional para desenvolvimento
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: gestao-leitos-app-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    restart: unless-stopped
    environment:
      - NODE_ENV=development
    networks:
      - gestao-leitos-network
    profiles:
      - dev

networks:
  gestao-leitos-network:
    driver: bridge
